# Render free web service. The full lexicon is not in this repo: it is fetched
# at boot from a private Hugging Face dataset. Set LEXICON_TOKEN in the
# dashboard to a read-only HF token. Without it the app serves the 309-entry
# sample; /healthz shows which one loaded.
services:
  - type: web
    name: khmer-terminology
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: LEXICON_URL
        value: https://huggingface.co/datasets/spnnnn/khmer-lexicon-data/resolve/main/unified_lexicon.json
      - key: LEXICON_TOKEN
        sync: false
