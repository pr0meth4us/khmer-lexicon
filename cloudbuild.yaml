# Auto-deploy on push, via a Cloud Build trigger.
#
# Build context is the repository root, not web/: the Dockerfile copies
# khmerlex/, dist/ and web/ separately because app.py resolves the lexicon as
# BASE.parent, so flattening web/ into /app would break it.
#
# Deliberately does NOT set --set-env-vars. gcloud run deploy preserves
# configuration it is not told to change, and ADMIN_TOKEN is set on the service
# but is not in this repository — rebuilding that list here would blank it and
# still report success. This trigger ships code, not config.
substitutions:
  _SERVICE: khmer-terminology
  _REGION: asia-southeast1
  _REPO: cloud-run-source-deploy

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --revision-suffix=sha-${SHORT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
